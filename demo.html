<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<title>Store</title>
<style>
  :root{
    --ink:#141414;
    --paper:#f5f4f0;
    --line:#141414;
    --accent:#ff4d1c;
    --accent-ink:#141414;
  }
 
  *{ box-sizing:border-box; margin:0; padding:0; }
 
  body{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
 
  /* ===== NAVBAR ===== */
  .navbar{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    padding: 18px 40px;
    background:var(--paper);
    border-bottom: 3px solid var(--ink);
  }
 
  .logo{
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    justify-self:start;
  }
  .logo span{ color:var(--accent); }
 
  .nav-center{
    display:flex;
    gap: 48px;
    justify-self:center;
  }
 
  .nav-center a{
    position:relative;
    text-decoration:none;
    color:var(--ink);
    font-weight:700;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 2px;
  }
 
  .nav-center a::after{
    content:"";
    position:absolute;
    left:0; bottom:-2px;
    width:0%;
    height:3px;
    background:var(--accent);
    transition: width .25s ease;
  }
 
  .nav-center a:hover::after{ width:100%; }
 
  .nav-right{
    display:flex;
    gap: 14px;
    justify-self:end;
    align-items:center;
  }
 
  .btn{
    text-decoration:none;
    font-weight:700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    transition: all .2s ease;
  }
 
  .btn-login{
    color:var(--ink);
    background:transparent;
  }
  .btn-login:hover{
    background:var(--ink);
    color:var(--paper);
  }
 
  .btn-signup{
    color:var(--accent-ink);
    background:var(--accent);
    border-color:var(--accent);
  }
  .btn-signup:hover{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }
 
  /* mobile */
  @media (max-width: 700px){
    .navbar{
      grid-template-columns: 1fr;
      row-gap: 14px;
      padding: 16px 20px;
    }
    .logo, .nav-center, .nav-right{ justify-self:center; }
    .nav-center{ gap: 28px; }
  }
.navbar a.active {
    color: orange;
    border-bottom: 3px solid orange;
    padding-bottom: 10px;
}


</style>
</head>

<body>
 <nav class="navbar">
    <div class="logo">
	<span>Store</span></div>
 
    <div class="nav-center">
      <a href="home.html" class="active" >Home</a>
      <a href="login.jsp">Men</a>
      <a href="login.jsp">Women</a>
    </div>
 
    <div class="nav-right">
      <a href="login.jsp" class="btn btn-login">Login</a>
      <a href="signin.jsp" class="btn btn-signup">Sign In</a>
    </div>
</nav>
</body>
</html>
